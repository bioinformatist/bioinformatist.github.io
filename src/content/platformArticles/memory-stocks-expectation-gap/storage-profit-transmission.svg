<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f7f3ec"/>
  <style>
    text {
      font-family: "Noto Sans CJK SC", sans-serif;
      fill: #202020;
      letter-spacing: 0;
    }
    .title { font-size: 38px; font-weight: 700; }
    .subtitle { font-size: 22px; fill: #5f5a54; }
    .label { font-size: 22px; font-weight: 700; }
    .body { font-size: 19px; }
    .small { font-size: 16px; fill: #68625c; }
  </style>
  <title>存储产业链利润传导</title>
  
    <text x="60" y="70" class="title">同一轮涨价，不是同一张利润表</text>
    <text x="60" y="110" class="subtitle">上市地点不是利润因子，产业链位置才是</text>
    <line x1="95" y1="180" x2="1105" y2="180" stroke="#262626" stroke-width="4"/>
    <text x="600" y="155" class="label" text-anchor="middle">DRAM 价格上涨</text>
    
          <line x1="160" y1="180" x2="160" y2="235" stroke="#77716b" stroke-width="3"/>
          <path d="M151 223 L160 237 L169 223" fill="none" stroke="#77716b" stroke-width="3"/>
          <rect x="55" y="250" width="210" height="410" rx="8" fill="#fffdf9" stroke="#f29b21" stroke-width="4"/>
          <rect x="55" y="250" width="210" height="86" rx="6" fill="#f29b21"/>
          <text x="160" y="304" class="label" text-anchor="middle" fill="#ffffff">DRAM 原厂</text>
          <text x="160" y="390" class="small" text-anchor="middle">首先影响</text>
          <text x="160" y="430" class="body" text-anchor="middle">售价与出货量</text>
          <line x1="80" y1="475" x2="240" y2="475" stroke="#ddd5cb" stroke-width="2"/>
          <text x="160" y="525" class="small" text-anchor="middle">最终观察</text>
          <text x="160" y="567" class="body" text-anchor="middle">收入、毛利率</text>
          <text x="160" y="620" class="small" text-anchor="middle" fill="#f29b21">直接价格暴露</text>
        
          <line x1="386" y1="180" x2="386" y2="235" stroke="#77716b" stroke-width="3"/>
          <path d="M377 223 L386 237 L395 223" fill="none" stroke="#77716b" stroke-width="3"/>
          <rect x="281" y="250" width="210" height="410" rx="8" fill="#fffdf9" stroke="#55a57f" stroke-width="4"/>
          <rect x="281" y="250" width="210" height="86" rx="6" fill="#55a57f"/>
          <text x="386" y="304" class="label" text-anchor="middle" fill="#ffffff">模组厂</text>
          <text x="386" y="390" class="small" text-anchor="middle">首先影响</text>
          <text x="386" y="430" class="body" text-anchor="middle">晶圆采购与库存</text>
          <line x1="306" y1="475" x2="466" y2="475" stroke="#ddd5cb" stroke-width="2"/>
          <text x="386" y="525" class="small" text-anchor="middle">最终观察</text>
