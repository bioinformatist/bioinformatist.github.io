          <text x="838" y="620" class="small" text-anchor="middle" fill="#9b75ad">间接传导</text>
        
          <line x1="1064" y1="180" x2="1064" y2="235" stroke="#77716b" stroke-width="3"/>
          <path d="M1055 223 L1064 237 L1073 223" fill="none" stroke="#77716b" stroke-width="3"/>
          <rect x="959" y="250" width="210" height="410" rx="8" fill="#fffdf9" stroke="#c06d5e" stroke-width="4"/>
          <rect x="959" y="250" width="210" height="86" rx="6" fill="#c06d5e"/>
          <text x="1064" y="304" class="label" text-anchor="middle" fill="#ffffff">终端品牌</text>
          <text x="1064" y="390" class="small" text-anchor="middle">首先影响</text>
          <text x="1064" y="430" class="body" text-anchor="middle">零部件成本</text>
          <line x1="984" y1="475" x2="1144" y2="475" stroke="#ddd5cb" stroke-width="2"/>
          <text x="1064" y="525" class="small" text-anchor="middle">最终观察</text>
          <text x="1064" y="567" class="body" text-anchor="middle">提价、降配或需求受压</text>
          <text x="1064" y="620" class="small" text-anchor="middle" fill="#c06d5e">间接传导</text>
        
    <text x="600" y="735" class="body" text-anchor="middle">“存储概念股”共享题材，不代表共享同一种盈利弹性。</text>
  
</svg>