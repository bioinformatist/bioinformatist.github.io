          <text x="386" y="620" class="small" text-anchor="middle" fill="#55a57f">间接传导</text>
        
          <line x1="612" y1="180" x2="612" y2="235" stroke="#77716b" stroke-width="3"/>
          <path d="M603 223 L612 237 L621 223" fill="none" stroke="#77716b" stroke-width="3"/>
