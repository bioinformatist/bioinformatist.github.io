<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Long gamma vs ordinary grid strategy</title>
  <desc id="desc">A two-panel schematic comparing long gamma exposure with ordinary long grid trading.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#f2994a" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#d83f31" />
    </marker>
    <style>
      .bg { fill: #fbfbf8; }
      .card { fill: #ffffff; stroke: #202020; stroke-width: 2; }
      .title { font: 700 34px "Noto Sans CJK SC", "Noto Sans CJK", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .subtitle { font: 700 25px "Noto Sans CJK SC", "Noto Sans CJK", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .label { font: 500 19px "Noto Sans CJK SC", "Noto Sans CJK", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #222222; }
      .small { font: 500 16px "Noto Sans CJK SC", "Noto Sans CJK", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4a4a4a; }
      .axis { stroke: #777777; stroke-width: 2; }
      .grid { stroke: #d7d2c8; stroke-width: 1.5; stroke-dasharray: 6 8; }
      .orange { stroke: #f2994a; fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .red { stroke: #d83f31; fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .orange-fill { fill: #f2994a; }
      .red-fill { fill: #d83f31; }
      .muted { fill: #f4efe6; stroke: #d0c7ba; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="720" />
  <text class="title" x="600" y="56" text-anchor="middle">Long gamma 喜欢“动得大”，网格喜欢“来回动”</text>

  <rect class="card" x="55" y="95" width="520" height="565" rx="14" />
  <rect class="card" x="625" y="95" width="520" height="565" rx="14" />

  <text class="subtitle" x="315" y="142" text-anchor="middle">正 gamma / long vol</text>
  <text class="small" x="315" y="172" text-anchor="middle">买的是凸性，价格偏离越大越有价值</text>

  <line class="axis" x1="125" y1="425" x2="505" y2="425" />
  <line class="axis" x1="315" y1="465" x2="315" y2="230" />
  <text class="small" x="510" y="431">到期价格</text>
  <text class="small" x="285" y="226">收益</text>

  <path class="orange" d="M132 262 C200 366, 252 420, 315 420 C378 420, 430 366, 498 262" />
  <circle class="orange-fill" cx="315" cy="420" r="7" />

  <text class="label" x="160" y="255" text-anchor="middle">大跌</text>
  <text class="label" x="160" y="282" text-anchor="middle">也可能受益</text>
  <text class="label" x="470" y="255" text-anchor="middle">大涨</text>
  <text class="label" x="470" y="282" text-anchor="middle">也可能受益</text>
  <text class="label" x="315" y="458" text-anchor="middle">不动时损耗成本</text>

  <rect class="muted" x="120" y="505" width="390" height="92" rx="10" />
  <text class="label" x="315" y="540" text-anchor="middle">核心问题：</text>
  <text class="label" x="315" y="572" text-anchor="middle">价格有没有足够大的运动？</text>

  <text class="subtitle" x="885" y="142" text-anchor="middle">普通多头网格</text>
  <text class="small" x="885" y="172" text-anchor="middle">赌的是路径，价格要能穿越网格再回来</text>

  <line class="axis" x1="700" y1="465" x2="1078" y2="465" />
  <line class="axis" x1="700" y1="465" x2="700" y2="225" />
  <text class="small" x="1084" y="471">时间</text>
  <text class="small" x="670" y="226">价格</text>

  <line class="grid" x1="700" y1="260" x2="1075" y2="260" />
  <line class="grid" x1="700" y1="310" x2="1075" y2="310" />
  <line class="grid" x1="700" y1="360" x2="1075" y2="360" />
  <line class="grid" x1="700" y1="410" x2="1075" y2="410" />

  <path class="orange" d="M720 360 L770 310 L820 360 L870 310 L920 360 L970 310 L1020 360" marker-end="url(#arrow-orange)" />
  <text class="label" x="893" y="290" text-anchor="middle">区间往返：成交利润</text>

  <path class="red" d="M720 265 L795 305 L870 350 L945 398 L1020 445" marker-end="url(#arrow-red)" />
  <text class="label" x="913" y="438" text-anchor="middle">单边下跌：库存增加</text>

  <rect class="red-fill" x="750" y="530" width="28" height="28" />
  <rect class="red-fill" x="805" y="505" width="28" height="53" />
  <rect class="red-fill" x="860" y="480" width="28" height="78" />
  <rect class="red-fill" x="915" y="455" width="28" height="103" />
  <text class="small" x="764" y="582" text-anchor="middle">1份</text>
  <text class="small" x="819" y="582" text-anchor="middle">2份</text>
  <text class="small" x="874" y="582" text-anchor="middle">3份</text>
  <text class="small" x="929" y="582" text-anchor="middle">4份</text>
  <text class="label" x="890" y="622" text-anchor="middle">越跌，手里的货越多</text>
</svg>
